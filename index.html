<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1ea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Awareness" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/icon-192.png" type="image/png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Awareness</title>
</head>
<body>
  <main id="app">
    <!-- Screen 1: Check in -->
    <section class="screen" data-screen="checkin">
      <h1 class="prompt">What is your mind doing right now?</h1>
      <div class="states" id="states"></div>

      <div class="reminders" id="reminders">
        <p class="reminders-status" id="reminders-status">Reminders off</p>
        <button class="link" id="reminders-toggle" type="button">Turn on gentle reminders</button>
        <p class="reminders-hint hidden" id="reminders-hint"></p>
      </div>
    </section>

    <!-- Screen 2: Awareness -->
    <section class="screen hidden" data-screen="awareness">
      <p class="eyebrow" id="aware-state"></p>
      <h2 class="message" id="aware-message"></h2>
      <p class="action hidden" id="aware-action"></p>

      <div class="spacer"></div>

      <div class="feedback-block hidden" id="feedback-block">
        <p class="lead">Did this help?</p>
        <div class="feedback">
          <button class="feedback-btn" data-feedback="yes" type="button">Yes</button>
          <button class="feedback-btn" data-feedback="little" type="button">A little</button>
          <button class="feedback-btn" data-feedback="no" type="button">No</button>
        </div>
        <button class="link subtle" id="skip-btn" type="button">Skip</button>
      </div>

      <button class="primary hidden" id="continue-btn" type="button">Continue</button>
    </section>

    <!-- Screen 3: Done -->
    <section class="screen hidden" data-screen="done">
      <h2 class="message soft">Return to your day.</h2>
      <div class="spacer"></div>
      <button class="link subtle" id="again-btn" type="button">Check in again</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
